apiVersion: v1
kind: Service
metadata:
  name: {{ include "patient-service.mysqlServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patient-service.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "patient-service.mysqlServiceName" . }}
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
  type: ClusterIP
