apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patient-service.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patient-service.labels" . | nindent 4 }}
type: Opaque
# Values from values.yaml are plain text; Helm encodes them to base64 here.
# Override: helm install ... --set mysql.user=myuser --set mysql.rootPassword=mypassword
data:
  DB_USER: {{ .Values.mysql.user | b64enc | quote }}
  DB_PASSWORD: {{ .Values.mysql.rootPassword | b64enc | quote }}
