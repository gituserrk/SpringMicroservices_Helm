apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patient-core-service.mysqlServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "patient-core-service.mysqlServiceName" . }}
    {{- include "patient-core-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "patient-core-service.mysqlServiceName" . }}
  strategy:
    type: Recreate   # Required for RWO PVC — rolling update blocks on volume re-attach
  template:
    metadata:
      labels:
        app: {{ include "patient-core-service.mysqlServiceName" . }}
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "patient-core-service.mysqlServiceName" . }}-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "patient-core-service.mysqlServiceName" . }}-secret
                  key: mysql-database
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: {{ include "patient-core-service.mysqlServiceName" . }}-pvc
