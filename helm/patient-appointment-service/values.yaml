# Appointment Service — Helm values
# Override any value with: helm install ... --set key=value
# or: helm install ... -f custom-values.yaml

replicaCount: 1

image:
  repository: patient-appointment-service
  tag: latest
  pullPolicy: Never

fullnameOverride: patient-appointment-service

service:
  type: NodePort   # Exposed externally via Minikube for demo testing
  port: 8081

mysql:
  image: "mysql:8.0"
  port: 3306
  database: appointment_db
  user: root
  rootPassword: root
  storage: 1Gi

# URL of PatientCore Service — must match its Kubernetes Service DNS name.
# Default matches fullnameOverride in the patient-core-service chart.
patientService:
  url: "http://patient-core-service:8080"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

probes:
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 5
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 3
