apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: healthcare
  labels:
    app: patient-service
spec:
  selector:
    app: patient-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  # ClusterIP: reachable only within the cluster.
  # Appointment Service uses DNS name "patient-service:8080" to call this.
  type: ClusterIP
