apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-core-service
  namespace: healthcare
  labels:
    app: patient-core-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-core-service
  template:
    metadata:
      labels:
        app: patient-core-service
    spec:
      containers:
        - name: patient-core-service
          image: patient-core-service:latest
          # Never: use the image built directly into Minikube's Docker daemon.
          # Change to Always (or IfNotPresent) when pulling from a registry.
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: patient-core-service-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: patient-core-service-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: patient-core-service-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: patient-core-service-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patient-core-service-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
