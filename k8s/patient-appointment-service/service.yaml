apiVersion: v1
kind: Service
metadata:
  name: patient-appointment-service
  namespace: healthcare
  labels:
    app: patient-appointment-service
spec:
  selector:
    app: patient-appointment-service
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
  # NodePort exposes the service on each Node's IP at a static port.
  # Use "minikube service patient-appointment-service -n healthcare" to get the URL.
  # Switch to ClusterIP + Ingress for production.
  type: NodePort
